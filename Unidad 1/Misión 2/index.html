<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/app.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <title>Misión 2</title>
</head>
<body>
    <div id="titulo">
        <h1>Generador de contraseñas</h1>
        <h2>Configura el tipo de contraseña que deseas y pulsa generar</h2>
    </div>

    <div id="box_principal">
        <div id="usuario_input">
            <div class="input">
                <p>¿Deseas usar números?</p>
                <input type="checkbox" id="numeros"><br>
            </div>

            <div class="input">
                <p>¿Deseas usar simbolos?</p>
                <input type="checkbox" id="simbolos"><br>
            </div>
            
            <div class="input">
                <p>Ingresa la longitud de la contraseña</p>
                <input type="number" id="longitud">
            </div>
            <input type="button" value="generar" id="generar">
        </div>
        <p id="clave"></p>
    </div>
</body>
</html>
